# Tiny Tapeout project information
project:
  title:        "The Sensor: Monocular Temporal Kernel"
  author:       "Damir Wallener"
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A tile-streaming visual front end with oriented, temporal, and motion features"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_dwallener_sensor"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "mono_temporal_core.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "input_data[0]"
  ui[1]: "input_data[1]"
  ui[2]: "input_data[2]"
  ui[3]: "input_data[3]"
  ui[4]: "input_data[4]"
  ui[5]: "input_data[5]"
  ui[6]: "input_data[6]"
  ui[7]: "input_data[7]"

  # Outputs
  uo[0]: "output_data[0]"
  uo[1]: "output_data[1]"
  uo[2]: "output_data[2]"
  uo[3]: "output_data[3]"
  uo[4]: "output_data[4]"
  uo[5]: "output_data[5]"
  uo[6]: "output_data[6]"
  uo[7]: "output_data[7]"

  # Bidirectional pins
  uio[0]: "input_valid"
  uio[1]: "output_ready"
  uio[2]: "input_ready"
  uio[3]: "output_valid"
  uio[4]: "busy"
  uio[5]: "error"
  uio[6]: "output_first"
  uio[7]: "output_last"

# Do not change!
yaml_version: 6
